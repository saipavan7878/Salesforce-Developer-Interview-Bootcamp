<template>
    <lightning-card title="Placement Parent">
        <div class="slds-p-around_medium">

            <lightning-input
                label="Student Record Id"
                value={studentId}
                onchange={handleIdChange}>
            </lightning-input>

            <template if:true={studentId}>
                <c-placementchild
                    student-id={studentId}
                    onstudentselected={handleStudentSelected}>
                </c-placementchild>
            </template>

            <template if:true={message}>
                <p class="slds-m-top_medium">
                    <strong>Parent received:</strong> {message}
                </p>
            </template>

        </div>
    </lightning-card>
</template>
