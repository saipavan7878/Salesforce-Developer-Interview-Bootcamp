<template>
    <lightning-card title="Eligible Jobs">

        <div class="slds-p-around_medium">

            <template if:true={loading}>
                <lightning-spinner
                    alternative-text="Loading eligible jobs">
                </lightning-spinner>
            </template>

            <template if:true={applying}>
                <lightning-spinner
                    alternative-text="Submitting application">
                </lightning-spinner>
            </template>

            <template if:false={loading}>

                <template if:true={successMessage}>
                    <div class="slds-text-color_success slds-m-bottom_medium">
                        {successMessage}
                    </div>
                </template>

                <template if:true={error}>
                    <div class="slds-text-color_error slds-m-bottom_medium">
                        {error}
                    </div>
                </template>

                <template if:false={error}>

                    <template if:true={hasJobs}>

                        <template
                            for:each={jobs}
                            for:item="job">

                            <c-job-card
                                key={job.Id}
                                job={job}
                                onviewdetails={handleViewDetails}
                                onapply={handleApply}>
                            </c-job-card>

                        </template>

                    </template>

                    <template if:false={hasJobs}>
                        <c-empty-state
                            title="No Eligible Jobs"
                            message="No eligible opportunities are available right now.">
                        </c-empty-state>
                    </template>

                    <template if:true={hasSelectedJob}>
                        <div class="slds-box slds-m-top_medium">

                            <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                                Job Details
                            </h2>

                            <p class="slds-m-bottom_small">
                                <strong>Company:</strong>
                                {selectedJob.Company__c}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Role:</strong>
                                {selectedJob.Role__c}
                            </p>

                            <p class="slds-m-bottom_small">
                                <strong>Minimum CGPA:</strong>
                                {selectedJob.Minimum_CGPA__c}
                            </p>

                            <p>
                                <strong>Closing Date:</strong>
                                {selectedJob.Closing_Date__c}
                            </p>

                        </div>
                    </template>

                </template>

            </template>

        </div>

    </lightning-card>
</template>
