<template>
    <lightning-card title="Eligible Jobs">

        <div class="slds-p-around_medium">

            <template if:true={loading}>
                <lightning-spinner
                    alternative-text="Loading eligible jobs">
                </lightning-spinner>
            </template>

            <template if:false={loading}>

                <template if:true={error}>
                    <div class="slds-text-color_error slds-m-bottom_medium">
                        {error}
                    </div>
                </template>

                <template if:false={error}>

                    <template if:true={hasJobs}>

                        <template
                            for:each={jobs}
                            for:item="job"
                        >

                            <div
                                key={job.Id}
                                class="slds-box slds-m-bottom_small"
                            >

                                <h2 class="slds-text-heading_small">
                                    {job.Company__c}
                                </h2>

                                <p class="slds-m-top_x-small">
                                    <strong>Role:</strong>
                                    {job.Role__c}
                                </p>

                                <p>
                                    <strong>Minimum CGPA:</strong>
                                    {job.Minimum_CGPA__c}
                                </p>

                                <p>
                                    <strong>Deadline:</strong>
                                    {job.Closing_Date__c}
                                </p>

                                <lightning-button
                                    class="slds-m-top_small"
                                    label="View Details"
                                    variant="brand"
                                    data-id={job.Id}
                                    onclick={handleViewDetails}>
                                </lightning-button>

                            </div>

                        </template>

                    </template>

                    <template if:false={hasJobs}>
                        <div class="slds-text-align_center">
                            <p>
                                No eligible jobs are currently available.
                            </p>
                        </div>
                    </template>

                    <template if:true={hasSelectedJob}>

                        <div class="slds-box slds-m-top_medium">

                            <h2 class="slds-text-heading_medium slds-m-bottom_medium">
                                Job Details
                            </h2>

                            <p>
                                <strong>Company:</strong>
                                {selectedJob.Company__c}
                            </p>

                            <p>
                                <strong>Role:</strong>
                                {selectedJob.Role__c}
                            </p>

                            <p>
                                <strong>Minimum CGPA:</strong>
                                {selectedJob.Minimum_CGPA__c}
                            </p>

                            <p>
                                <strong>Closing Date:</strong>
                                {selectedJob.Closing_Date__c}
                            </p>

                        </div>

                    </template>

                </template>

            </template>

        </div>

    </lightning-card>
</template>
